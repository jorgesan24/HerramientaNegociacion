<!-- CORRECCIÓN: Envolvemos todo el bloque en el formulario dinámico de Flask -->
<form id="frmReferencia" action="/referencia" method="POST">

    <div class="ref-bloque-inferior">

        <div class="ref-panel-header">
            <div class="ref-header-texto">
                <h3>Buscar por:</h3>
                <p>
                    <label id="lblCriterio" class="ref-label-buscar">CUM</label>
                </p>
            </div>
        </div>
       
        <div class="ref-buscador-acciones">
            
            <div class="ref-input-buscar-wrapper">
                <span class="lupa-icono">🔍</span>

                <!-- Modificamos la clase para que se oculte o muestre desde el servidor -->
                <div id="busquedaTexto" style="width: 100%;" class="{% if tipo_filtro == 'REGIONAL' %}oculto{% endif %}">
                    <input type="text" name="filtro" value="{{ filtro }}">
                </div>

                <!-- Modificamos la clase para que el select solo aparezca si el filtro es REGIONAL -->
                <div id="busquedaRegional" style="width: 100%;" class="{% if tipo_filtro != 'REGIONAL' %}oculto{% endif %}">
                    <select name="regional" class="form-control">
                        <option value="">Seleccione regional</option>
                        {% for regional in regionales %}
                        <option value="{{ regional }}" {% if filtro == regional %}selected{% endif %}>
                            {{ regional }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>  
     

            <button type="submit" class="btn-principal">
                <img src="{{ url_for('static', filename='img/buscar.png') }}" style="margin-right: 8px; height: 26px;">
                Buscar
            </button>
                    
            {% if resultados %}
            <a href="/exportar?filtro={{ filtro }}&tipo_filtro={{ tipo_filtro }}" class="link-exportar">
                <button type="button" class="btn-secundario">
                    <img src="{{ url_for('static', filename='img/excel.png') }}" style="margin-right:8px;">
                    Exportar
                </button>
            </a>
            {% else %}
            <button type="button" class="btn-secundario" disabled>
                <img src="{{ url_for('static', filename='img/excel.png') }}" style="margin-right:8px; opacity:.45;">
                Exportar
            </button>
            {% endif %}

            <button
                id="btnDetalle"
                type="button"
                class="btn-secundario"
                data-cum="{% if request.args.get('codigo') %}{{ request.args.get('codigo') }}{% elif filtro %}{{ filtro }}{% endif %}"
                onclick="abrirDetalleFacturacionModal(this, event)">
                <img src="{{ url_for('static', filename='img/detalle.png') }}" style="margin-right: 8px; height: 40px">
                Detalle    
            </button>
            
        </div>
        
    </div>

</form> <!-- Cierre del formulario -->
